<form method="GET" style="margin-bottom:1rem; display:flex; gap:8px; align-items:center;">
    <label for="anio-panel">Período</label>
    <select id="anio-panel" name="anio" onchange="this.form.submit()" style="padding:8px 12px; border:1px solid #D1D5DB; border-radius:7px; background:white;">
        <option value="Todos" {% if anio_seleccionado == 'Todos' %}selected{% endif %}>Todos los años</option>
        {% for anio in anios_disponibles %}
        <option value="{{ anio }}" {% if anio_seleccionado == anio %}selected{% endif %}>{{ anio }}</option>
        {% endfor %}
    </select>
    <button type="submit" style="padding:8px 12px; border:1px solid #D1D5DB; border-radius:7px; background:white;">Aplicar</button>
</form>
