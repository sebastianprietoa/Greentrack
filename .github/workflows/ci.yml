name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare isolated PostgreSQL
        shell: bash
        run: |
          DB_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          SESSION_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$SESSION_KEY"
          docker run -d --name greentrack-test -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=greentrack_staging -p 127.0.0.1:55432:5432 postgres:18
          for attempt in {1..30}; do
            if docker exec greentrack-test pg_isready -U postgres; then break; fi
            sleep 1
          done
          echo "DATABASE_URL=postgresql://postgres:$DB_PASSWORD@127.0.0.1:55432/greentrack_staging" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://postgres:$DB_PASSWORD@127.0.0.1:55432/greentrack_staging" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$SESSION_KEY" >> "$GITHUB_ENV"
          echo "PGSSLMODE=disable" >> "$GITHUB_ENV"
          echo "GREENTRACK_INIT_DB=0" >> "$GITHUB_ENV"

      - name: Initialize test schema
        run: python -c "from app import init_db; init_db()"

      - name: Run regression tests
        run: python -m pytest -q

      - name: Compile project
        run: python -m compileall .
